# Runs the pipeline on GitHub's servers using the config in ./workspace.
# The SQLite database is kept between runs with actions/cache (history, "new" detection,
# your labels). The digest is shown in the run summary.
name: AutoJob daily

on:
  workflow_dispatch: {}
  # Uncomment to run every day at 14:00 UTC:
  # schedule:
  #   - cron: "0 14 * * *"

concurrency:
  group: autojob
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      AUTOJOB_CONFIG: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: workspace/data
          key: autojob-db-${{ github.run_id }}
          restore-keys: autojob-db-
      - run: pip install .
      - run: autojob run
      - run: autojob digest >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: workspace/data
          key: autojob-db-${{ github.run_id }}
