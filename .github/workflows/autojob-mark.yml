# Mark a job applied / ignored from the GitHub UI (Actions tab -> Run workflow).
name: AutoJob mark

on:
  workflow_dispatch:
    inputs:
      status:
        description: Status
        type: choice
        options: [applied, ignored, closed, new]
        default: applied
      job:
        description: Job URL or id (from the digest)
        required: true
      note:
        description: Optional note
        required: false
        default: ""

concurrency:
  group: autojob
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AUTOJOB_CONFIG: workspace
      # Inputs go through env vars, never straight into the script, to avoid shell injection.
      IN_STATUS: ${{ inputs.status }}
      IN_JOB: ${{ inputs.job }}
      IN_NOTE: ${{ inputs.note }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: autojob mark "$IN_STATUS" "$IN_JOB" --note "$IN_NOTE"
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workspace/data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(autojob): mark $IN_STATUS"
          git push
