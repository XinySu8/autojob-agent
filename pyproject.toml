[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autojob-agent"
dynamic = ["version"]
description = "Fetch, rank and AI-review internship postings from Greenhouse, Lever, Ashby and Workday – CLI, REST API and web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xinyi Su" }]
keywords = ["jobs", "internship", "greenhouse", "lever", "ashby", "workday", "job-search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = [
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.7", "numpy>=1.26"]
agent = ["langchain-core>=0.3", "langchain-ollama>=0.2"]
dev = ["pytest>=7", "ruff>=0.5", "httpx>=0.27", "langchain-core>=0.3"]

[project.scripts]
autojob = "autojob.cli:main"

[project.urls]
Homepage = "https://github.com/XinySu8/autojob-agent"

[tool.setuptools.dynamic]
version = { attr = "autojob.__version__" }

[tool.setuptools.packages.find]
include = ["autojob*"]

[tool.setuptools.package-data]
"autojob" = ["static/**/*", "migrations/*.mako"]
"autojob.templates" = ["*.yaml", "*.md"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["autojob/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
